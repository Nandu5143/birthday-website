<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to the Surprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background-image: url('background.jpeg'); /* replace with your image URL or path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            color: cornflowerblue;
        }
        button {
            font-size: 20px;
            padding: 12px 24px;
            border: none;
            background: #f06292;
            color: white;
            cursor: pointer;
            border-radius: 10px;
        }
        #message {
            font-size: 18px;
            margin: 20px;
            color: #333;
        }
        #form-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🎉 Welcome to Your Birthday Surprise! 🎂</h1>
    <p id="message">Click the button to continue...</p>
    <button onclick="checkBirthday()">Start</button>

    <!-- ✅ Only this will be used for the link -->
    <div id="form-container"></div>

    <script>
        function checkBirthday() {
            const birthdayStr = "2025-08-04T00:00:00"; // 🎂 Set your birthday
            const birthday = new Date(birthdayStr);
            const today = new Date();

            if (
                today.getDate() === birthday.getDate() &&
                today.getMonth() === birthday.getMonth()
            ) {
                window.location.href = "index.html";
                return;
            }

            startCountdown(birthday);
            showGoogleForm();
        }

        function startCountdown(targetDate) {
            const message = document.getElementById("message");

            const interval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate.getTime() - now;

                if (distance <= 0) {
                    clearInterval(interval);
                    message.innerText = "🎉 It's your birthday! Refresh to celebrate!";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                message.innerText = `⏳ Your birthday is in ${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        function showGoogleForm() {
            const formContainer = document.getElementById("form-container");
            formContainer.innerHTML = `
                <p>🎁 While you're here, fill this secret form:</p>
                <a href="https://forms.gle/YOUR_FORM_LINK" target="_blank" style="font-weight: bold; color: #007bff;">👉 Click here to fill the birthday form</a>
            `;
        }
    </script>
</body>
</html>
